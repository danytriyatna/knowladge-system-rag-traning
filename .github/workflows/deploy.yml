name: Build & Deploy JP-Insight

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-insight-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck & Standalone Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - name: Run standalone unit tests (no DB/API required)
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: |
          npx vitest run \
            tests/pagination.test.ts \
            tests/ai-elements-chat.test.ts \
            tests/chat-history.test.ts \
            tests/rag/citation.test.ts \
            tests/rag/evidence.test.ts \
            tests/rag/regulations.test.ts

  build-and-deploy:
    name: Build Image & Deploy to VPS
    needs: check
    runs-on: ubuntu-latest
    env:
      GHCR_USER: ${{ secrets.GHCR_USERNAME || 'uzishdq' }}
      IMAGE_NAME: ${{ format('ghcr.io/{0}/jp-insight', secrets.GHCR_USERNAME || 'uzishdq') }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull & Restart JP-Insight on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'ubuntu' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" \
            "cd /opt/jurnal-permukiman/deploy && docker compose pull jp-insight && docker compose up -d --no-build jp-insight && docker image prune -f"
